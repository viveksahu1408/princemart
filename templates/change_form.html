{% extends "admin/change_form.html" %}

{% block field_sets %}
    {{ block.super }}
    <fieldset class="module aligned">
        <h2>🗺️ Draw Delivery Area on Map (Katni)</h2>
        <div style="padding: 10px;">
            <p><strong>How to use:</strong> Map ke top-right bar se <b>Polygon Tool (⬡)</b> choose karein aur boundary draw karein. Finish karne ke baad Save kar dein.</p>
            <div id="map" style="width: 100%; height: 450px; border: 2px solid #ccc; border-radius: 8px;"></div>
        </div>
    </fieldset>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Default Center: Katni (Lat: 23.8341, Lng: 80.3952)
            var katniLat = 23.8341, katniLng = 80.3952;
            var map = L.map('map').setView([katniLat, katniLng], 14);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            var drawnItems = new L.FeatureGroup();
            map.addLayer(drawnItems);

            var drawControl = new L.Control.Draw({
                draw: {
                    polygon: true,
                    polyline: false,
                    rectangle: false,
                    circle: false,
                    marker: false,
                    circlemarker: false
                },
                edit: {
                    featureGroup: drawnItems
                }
            });
            map.addControl(drawControl);

            var coordInput = document.getElementById("id_coordinates");

            // Existing coordinates load karna agar zone edit ho raha hai
            if (coordInput && coordInput.value && coordInput.value !== "[]") {
                try {
                    var savedCoords = JSON.parse(coordInput.value);
                    var leafletLatPairs = savedCoords.map(c => [c.lat, c.lng]);
                    var polygon = L.polygon(leafletLatPairs, {color: 'green'}).addTo(drawnItems);
                    map.fitBounds(polygon.getBounds());
                } catch(e) {
                    console.log("Parsing error:", e);
                }
            }

            function updateInput() {
                var layers = drawnItems.getLayers();
                if (layers.length > 0) {
                    var latLngs = layers[0].getLatLngs()[0];
                    var formatted = latLngs.map(pt => ({ lat: pt.lat, lng: pt.lng }));
                    coordInput.value = JSON.stringify(formatted);
                } else {
                    coordInput.value = "[]";
                }
            }

            map.on(L.Draw.Event.CREATED, function (e) {
                drawnItems.clearLayers();
                drawnItems.addLayer(e.layer);
                updateInput();
            });

            map.on(L.Draw.Event.EDITED, updateInput);
            map.on(L.Draw.Event.DELETED, function() {
                drawnItems.clearLayers();
                updateInput();
            });
        });
    </script>
{% endblock %}
